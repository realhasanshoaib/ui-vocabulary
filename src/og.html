<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #fff8ee; color: #211e33;
    font-family: "Bricolage Grotesque", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    border-top: 10px solid #211e33;
  }
  .kicker {
    font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: #5c5870;
    margin-bottom: 36px;
  }
  h1 { font-size: 116px; font-weight: 750; letter-spacing: -0.028em; line-height: 1.02; text-align: center; }
  h1 em { font-style: normal; color: #ff5d73; }
  .sub { margin-top: 32px; font-size: 29px; font-weight: 500; color: #5c5870; }
  .sub b { color: #211e33; }
  .dots { display: flex; gap: 14px; margin-top: 44px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; }
  .url {
    position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
    font-family: "IBM Plex Mono", monospace; font-size: 19px; color: #5c5870;
  }
</style>
</head>
<body>
  <div class="kicker">A field guide for building UI with AI agents</div>
  <h1>Speak fluent<br><em>interface.</em></h1>
  <p class="sub"><b>133 design terms</b>, each with a prompt for your agent</p>
  <div class="dots">
    <span style="background:#4d7cfe"></span><span style="background:#ff5d73"></span><span style="background:#8b5cf6"></span><span style="background:#10b981"></span><span style="background:#ff9838"></span><span style="background:#2fa8e0"></span><span style="background:#ec4aa8"></span><span style="background:#eab308"></span><span style="background:#84a812"></span><span style="background:#0d9d9d"></span>
  </div>
  <p class="url">ui-vocab.hasanshoaib.com</p>
</body>
</html>
